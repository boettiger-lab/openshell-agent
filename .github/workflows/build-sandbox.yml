# Build the compute sandbox image for amd64 and arm64 and publish it to GHCR.
#
# Both architectures build on NATIVE runners -- ubuntu-24.04 for amd64 and
# ubuntu-24.04-arm for arm64 -- rather than under QEMU. That matters here: the
# image is ~10GB and compiles nothing under emulation would make tolerable.
# Native arm64 hosted runners are free for public repositories, which this is.
#
# Each architecture pushes by digest, and a final job stitches the two digests
# into one manifest list, so `--from ghcr.io/.../compute:latest` resolves to the
# right architecture automatically.
name: Build sandbox image

on:
  push:
    branches: [main]
    paths:
      - 'sandboxes/compute/Dockerfile'
      - '.github/workflows/build-sandbox.yml'
  # Weekly, because the whole point of the derived image is a CURRENT Claude
  # Code -- the upstream community base went stale exactly this way.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/compute

jobs:
  build:
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      # A hosted runner has ~14GB free and the image is ~10GB, so this is not
      # optional -- without it the build dies on ENOSPC partway through export.
      - name: Reclaim disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/share/powershell "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          echo "after:"; df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./sandboxes/compute
          platforms: ${{ matrix.platform }}
          provenance: false
          # No layer cache on purpose: the only cacheable layers are small (apt,
          # node, venv) while the base is ~9GB, so a cache would cost more to
          # move than it saves, and GHA cache is capped at 10GB per repo anyway.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # The digest is the filename, with its "sha256:" prefix stripped --
      # upload-artifact rejects a colon in a path. The merge job puts it back.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"
          echo "${{ matrix.platform }} -> ${digest}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: merge manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagging, and why the commit tag is conditional: the weekly rebuild runs on
      # an unchanged main, so tagging :<sha> unconditionally would move an existing
      # tag to a different image -- silently breaking every pin to it, which is the
      # one thing a pin exists to prevent. So :<sha> is written only by the push
      # that introduced that commit, and every build also gets a dated tag that is
      # unique to it. :latest always follows the newest build.
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          sources=$(printf "${IMAGE}@sha256:%s " *)
          tags=( --tag "${IMAGE}:latest"
                 --tag "${IMAGE}:${GITHUB_SHA::12}-$(date -u +%Y%m%d)" )
          if [ "${{ github.event_name }}" = push ]; then
            tags+=( --tag "${IMAGE}:${GITHUB_SHA::12}" )
          else
            echo "not a push: leaving ${IMAGE}:${GITHUB_SHA::12} pointing where it does"
          fi
          docker buildx imagetools create "${tags[@]}" $sources

      - name: Show what was published
        run: |
          docker buildx imagetools inspect "${IMAGE}:latest"
          echo "Pin a sandbox to this build with:"
          echo "  openshell sandbox create --from ${IMAGE}:${GITHUB_SHA::12} --policy ./sandboxes/compute/policy.yaml"

  bump-pin:
    name: open a PR bumping the pin
    needs: merge
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Pin to whichever tag this build wrote that will NOT move: the commit tag
      # for a push, the dated tag for a scheduled or manual rebuild.
      - name: Resolve the tag to pin
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ]; then
            echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::12}-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Rewrite the pin
        id: edit
        run: |
          set -euo pipefail
          new="${IMAGE}:${{ steps.tag.outputs.tag }}"
          # python rather than sed: the line contains ${...} and $ escaping through
          # YAML into sed is a reliable way to corrupt it.
          python3 - "$new" <<'PY'
          import re, sys
          new = sys.argv[1]
          p = 'aliases.sh'
          s = open(p).read()
          s2, n = re.subn(r'^OPENSHELL_IMAGE=.*$',
                          'OPENSHELL_IMAGE="${OPENSHELL_IMAGE:-%s}"' % new,
                          s, count=1, flags=re.M)
          assert n == 1, "OPENSHELL_IMAGE line not found in aliases.sh"
          open(p, 'w').write(s2)
          PY
          bash -n aliases.sh
          if git diff --quiet aliases.sh; then
            echo "pin already at $new; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "new=$new" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the PR
        if: steps.edit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch=chore/bump-image-pin
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git commit -am "Bump the sandbox image pin to ${{ steps.tag.outputs.tag }}"
          git push --force origin "$branch"
          if gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            echo "PR already open; the force-push above updated it"
          else
            gh pr create --base main --head "$branch" \
              --title "Bump the sandbox image pin to ${{ steps.tag.outputs.tag }}" \
              --body-file - <<EOF
          \`os\` pins a commit tag rather than \`:latest\`, so a tag that moves cannot
          silently swap the image under a warm cache. The cost is that a newer build --
          including the weekly rebuild that picks up a newer Claude Code -- only arrives
          when the pin is bumped. This is that bump.

          New pin: \`${{ steps.edit.outputs.new }}\`

          Built by [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}), triggered by \`${{ github.event_name }}\`.

          Merging changes nothing already running: a sandbox binds to its image at create
          time, so existing sandboxes keep the image they were built from until they are
          deleted and recreated.
          EOF
          fi
